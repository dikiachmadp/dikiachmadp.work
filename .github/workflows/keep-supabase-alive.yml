name: Keep Supabase Alive

# Supabase free-tier mem-pause project setelah 7 hari tanpa aktivitas.
# Workflow ini menjalankan query ringan setiap 3 hari agar tetap aktif.
on:
  schedule:
    # Menit 0, jam 06:00 UTC, tiap 3 hari sekali
    - cron: "0 6 */3 * *"
  workflow_dispatch: {} # bisa dijalankan manual dari tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pg
        run: npm install pg --no-save

      # Isi secret ini dengan session pooler (port 5432): transaction pooler
      # bukan alat yang tepat untuk sekadar ping keaktifan.
      - name: Ping database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/keep-alive.mjs

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Nilai dummy: build tidak boleh butuh layanan eksternal hidup.
      # SKIP_DB_STATIC_GEN membuat generateStaticParams mengembalikan [], jadi
      # tidak ada halaman yang diprerender dan database tidak pernah disentuh.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/dummy"
      DIRECT_URL: "postgresql://user:pass@localhost:5432/dummy"
      NEXT_PUBLIC_SUPABASE_URL: "https://dummy.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-anon-key"
      RESEND_API_KEY: "re_dummy"
      CONTACT_EMAIL: "ci@example.com"
      UPSTASH_REDIS_REST_URL: "https://dummy.upstash.io"
      UPSTASH_REDIS_REST_TOKEN: "dummy-token"
      SKIP_DB_STATIC_GEN: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
